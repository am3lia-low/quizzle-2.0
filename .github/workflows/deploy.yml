# Publish the site to GitHub Pages whenever main changes (e.g. a quiz PR is merged).
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build every quiz + main page
        run: python3 scripts/build.py --out _site --clean
      - name: Keep preview pages for quiz PRs that are still open
        # A deploy replaces the whole site, so without this, merging one quiz PR would
        # take down the preview of another one still waiting for review.
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build_pr_previews.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
