<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Personality Quiz</title>
<meta name="description" content="A new personality quiz every week.">
<style>
:root {
  --bg: #faf7f2; --fg: #1f1d1a; --muted: #6b665e; --card: #ffffff;
  --border: #e6e0d6; --accent: #c2410c; --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171513; --fg: #f2eee8; --muted: #a39d93; --card: #22201d; --border: #37332e; --accent: #fb923c;
  }
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
.site-title { margin: 0; font-size: clamp(28px, 6vw, 40px); line-height: 1.1; }
.site-sub { margin: 4px 0 24px; color: var(--muted); }
.featured {
  display: block; text-decoration: none; color: var(--qfg, var(--fg));
  background: var(--qbg, var(--card)); border: 2px solid var(--qaccent, var(--accent));
  border-radius: calc(var(--radius) + 4px); padding: 24px 20px; margin-bottom: 32px;
}
.featured .label { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; opacity: .75; }
.featured .emoji { font-size: 56px; line-height: 1; margin: 8px 0; }
.featured h2 { margin: 0 0 6px; font-size: clamp(24px, 5vw, 34px); line-height: 1.2; }
.featured p { margin: 0 0 14px; }
.featured .cta { display: inline-block; background: var(--qaccent, var(--accent)); color: var(--qaccent-fg, #fff); border-radius: 999px; padding: 8px 18px; font-weight: 600; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.toolbar h2 { margin: 0 auto 0 0; font-size: 20px; }
.chip { font: inherit; font-size: 14px; cursor: pointer; border: 1.5px solid var(--border); background: var(--card); color: var(--fg); border-radius: 999px; padding: 4px 12px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.search { font: inherit; font-size: 15px; border: 1.5px solid var(--border); background: var(--card); color: var(--fg); border-radius: 999px; padding: 6px 14px; width: 100%; max-width: 260px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.card {
  display: flex; flex-direction: column; gap: 4px; text-decoration: none;
  color: var(--qfg, var(--fg)); background: var(--qbg, var(--card));
  border: 1.5px solid var(--border); border-top: 6px solid var(--qaccent, var(--accent));
  border-radius: var(--radius); padding: 14px 16px; transition: transform .1s ease;
}
.card:hover { transform: translateY(-2px); }
.card .emoji { font-size: 32px; line-height: 1; }
.card h3 { margin: 4px 0 0; font-size: 17px; line-height: 1.3; }
.card .meta { font-size: 13px; opacity: .75; }
.empty { color: var(--muted); }
a:focus-visible, .chip:focus-visible, .search:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="site-title">Weekly Personality Quiz</h1>
  <p class="site-sub">A new quiz every week. __COUNT__ so far.</p>
  __FEATURED__
  <div class="toolbar">
    <h2>All quizzes</h2>
    <input class="search" type="search" placeholder="Search quizzes" aria-label="Search quizzes">
  </div>
  <div class="toolbar" role="group" aria-label="Filter by category">__CHIPS__</div>
  <div class="grid">__CARDS__</div>
  <p class="empty" hidden>No quizzes match.</p>
</div>
<script>
(function () {
  var chips = document.querySelectorAll(".chip");
  var cards = document.querySelectorAll(".grid .card");
  var search = document.querySelector(".search");
  var empty = document.querySelector(".empty");
  var category = "all";
  function apply() {
    var q = search.value.trim().toLowerCase();
    var shown = 0;
    cards.forEach(function (c) {
      var ok = (category === "all" || c.dataset.category === category) &&
               (!q || c.dataset.search.indexOf(q) !== -1);
      c.hidden = !ok;
      if (ok) shown++;
    });
    empty.hidden = shown !== 0;
  }
  chips.forEach(function (chip) {
    chip.addEventListener("click", function () {
      category = chip.dataset.category;
      chips.forEach(function (c) { c.setAttribute("aria-pressed", String(c === chip)); });
      apply();
    });
  });
  search.addEventListener("input", apply);
})();
</script>
</body>
</html>
