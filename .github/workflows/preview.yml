# Preview quiz PRs before they're merged: every open quiz PR at
# https://<user>.github.io/<repo>/preview/<quiz-id>/, and the latest one at /preview/.
#
# Runs as pull_request_target so it deploys from main's context (GitHub Pages only
# accepts deployments from main by default). For safety it only ever runs main's
# build code; from each PR it takes nothing but the quiz data files (quiz.json and
# style.css), which build.py validates before using.
name: Preview quiz

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["quizzes/**"]

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only PRs from branches in this repo, never from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the live site from main
        run: python3 scripts/build.py --out _site --clean
      - name: Build preview pages for every open quiz PR
        # Every open quiz PR gets /preview/<quiz-id>/, so two PRs open at once (e.g. two quizzes
        # in one week) can both be played. /preview/ shows the PR that triggered this run.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/build_pr_previews.sh _site "$PR_NUMBER"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
