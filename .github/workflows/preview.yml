# Preview a quiz PR at https://<user>.github.io/<repo>/preview/ before it's merged.
#
# Runs as pull_request_target so it deploys from main's context (GitHub Pages only
# accepts deployments from main by default). For safety it only ever runs main's
# build code; from the PR it takes nothing but the quiz data files (quiz.json and
# style.css), which build.py validates before using.
name: Preview quiz

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths: ["quizzes/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Only PRs from branches in this repo, never from forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the live site from main
        run: python3 scripts/build.py --out _site --clean
      - name: Find the PR's quiz week
        id: week
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          week=$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- quizzes/ \
            | sed -nE 's#^quizzes/([0-9]{4}-W[0-9]{2})/quiz\.json$#\1#p' | sort -u | tail -n 1)
          if [ -z "$week" ]; then echo "No new quiz.json in this PR"; exit 1; fi
          echo "week=$week" >> "$GITHUB_OUTPUT"
      - name: Add the PR's quiz data (data files only)
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          mkdir -p "quizzes/$WEEK"
          git show "$HEAD_SHA:quizzes/$WEEK/quiz.json" > "quizzes/$WEEK/quiz.json"
          git show "$HEAD_SHA:quizzes/$WEEK/style.css" > "quizzes/$WEEK/style.css"
      - name: Build the preview page
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          python3 scripts/build.py --out _site --preview "$WEEK"
          echo "Preview of **$WEEK** will be at \`/preview/\` once deployed." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
